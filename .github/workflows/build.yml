name: Build CrabProxy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Windows ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-tauri }
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: CrabProxy-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ── Linux ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-tauri }
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: CrabProxy-Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  # ── macOS ──
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-tauri }
      - run: rustup target add ${{ matrix.target }}-apple-darwin
      - run: npm run tauri build -- --target ${{ matrix.target }}-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: CrabProxy-macOS-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}-apple-darwin/release/bundle/macos/*.app
